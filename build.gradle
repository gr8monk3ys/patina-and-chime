plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.version}+${project.minecraft_version}"

// Popular mods that touch the same code as this one. Load one into a run with -Pcompat=lithium.
def compatMods = [
	lithium: ["maven.modrinth:lithium:mc26.2-0.25.3-fabric"],
	easymagic: [
		"maven.modrinth:easy-magic:5CL4B48Y",
		"maven.modrinth:puzzles-lib:TXPuVSH3",
		"maven.modrinth:forge-config-api-port:rSd3GiG8",
	],
]

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"patinachime" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		configureEach {
			vmArg "-Xmx1500M"
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "patinachime-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

configurations {
	productionTestMods {
		transitive = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	if (project.hasProperty("compat")) {
		compatMods[project.property("compat")].each { runtimeOnly it }
	}

	// The released Fabric API jar leaves out the test modules, so the production runs add them.
	productionTestMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionTestMods fabricApi.module("fabric-gametest-api-v1", project.fabric_api_version)
	productionTestMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)
}

// The same tests as runGameTest and runClientGameTest, against the jar a player installs instead of the dev classes.
def gametestJar = tasks.register("gametestJar", Jar) {
	from sourceSets.gametest.output
	archiveClassifier = "gametest"
	destinationDirectory = layout.buildDirectory.dir("production-test")
}

tasks.register("productionGameTest", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
	mods.from(tasks.named("jar"), gametestJar, configurations.productionTestMods)
	installerVersion = "1.1.1"
	jvmArgs.addAll("-Xmx1500M", "-Dfabric-api.gametest")
	runDir = layout.buildDirectory.dir("run/productionGameTest")
	doFirst {
		def eula = runDir.file("eula.txt").get().asFile
		eula.parentFile.mkdirs()
		eula.text = "eula=true\n"
	}
}

tasks.register("productionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.from(tasks.named("jar"), gametestJar, configurations.productionTestMods)
	jvmArgs.addAll("-Xmx1500M", "-Dfabric.client.gametest")
	runDir = layout.buildDirectory.dir("run/productionClientGameTest")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
