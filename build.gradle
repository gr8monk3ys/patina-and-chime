plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.version}+${project.minecraft_version}"

// Popular mods players run alongside this one. Load them into a run with -Pcompat=lithium or -Pcompat=sodium,jade.
def compatMods = [
	lithium: ["maven.modrinth:lithium:f7vZ0VWU"],
	easymagic: [
		"maven.modrinth:easy-magic:5CL4B48Y",
		"maven.modrinth:puzzles-lib:TXPuVSH3",
		"maven.modrinth:forge-config-api-port:rSd3GiG8",
	],
	sodium: ["maven.modrinth:sodium:xJZxADzI"],
	iris: ["maven.modrinth:sodium:xJZxADzI", "maven.modrinth:iris:gxZWWnKH"],
	continuity: ["maven.modrinth:continuity:mgUN5Xz2"],
	modmenu: ["maven.modrinth:modmenu:iRo7AZXf", "maven.modrinth:placeholder-api:NDqH16LT"],
	jei: ["maven.modrinth:jei:j62WSkzi", "maven.modrinth:mezzconfig:YhSCy5W4"],
	rei: ["maven.modrinth:rei:4o0NSIMj", "maven.modrinth:architectury-api:ohb3PBGZ", "maven.modrinth:cloth-config:Nv3xnWXd"],
	jade: ["maven.modrinth:jade:ue8CO97w"],
	wthit: ["maven.modrinth:wthit:7hordoNl", "maven.modrinth:badpackets:SgNrUT3E"],
	appleskin: ["maven.modrinth:appleskin:uo5bAN1Y"],
	copperhopper: ["maven.modrinth:copper-hopper:ifTn94FS"],
	copperierage: ["maven.modrinth:the-copperier-age:bdbcvdJj", "maven.modrinth:frozenlib:DFsk0uXB"],
	c2me: ["maven.modrinth:c2me-fabric:4wjXxrDQ"],
	carpet: ["maven.modrinth:carpet:bGrLxJ8v"],
	ferritecore: ["maven.modrinth:ferrite-core:d5ddUdiB"],
	krypton: ["maven.modrinth:krypton:5WeL0Nkz"],
]

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"patinachime" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		configureEach {
			vmArg "-Xmx1500M"
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "patinachime-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

configurations {
	productionTestMods {
		transitive = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	if (project.hasProperty("compat")) {
		project.property("compat").split(",").each { name ->
			if (!compatMods.containsKey(name)) {
				throw new GradleException("no compat mod called ${name}, choose from ${compatMods.keySet()}")
			}

			compatMods[name].each { runtimeOnly it }
		}
	}

	// The released Fabric API jar leaves out the test modules, so the production runs add them.
	productionTestMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionTestMods fabricApi.module("fabric-gametest-api-v1", project.fabric_api_version)
	productionTestMods fabricApi.module("fabric-client-gametest-api-v1", project.fabric_api_version)
}

// The same tests as runGameTest and runClientGameTest, against the jar a player installs instead of the dev classes.
def gametestJar = tasks.register("gametestJar", Jar) {
	from sourceSets.gametest.output
	archiveClassifier = "gametest"
	destinationDirectory = layout.buildDirectory.dir("production-test")
}

tasks.register("productionGameTest", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
	mods.from(tasks.named("jar"), gametestJar, configurations.productionTestMods)
	installerVersion = "1.1.1"
	jvmArgs.addAll("-Xmx1500M", "-Dfabric-api.gametest")
	runDir = layout.buildDirectory.dir("run/productionGameTest")
	doFirst {
		def eula = runDir.file("eula.txt").get().asFile
		eula.parentFile.mkdirs()
		eula.text = "eula=true\n"
	}
}

tasks.register("productionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.from(tasks.named("jar"), gametestJar, configurations.productionTestMods)
	jvmArgs.addAll("-Xmx1500M", "-Dfabric.client.gametest")
	runDir = layout.buildDirectory.dir("run/productionClientGameTest")
	// ServerPlayClientGameTest starts a dedicated server in this directory.
	doFirst {
		def eula = runDir.file("eula.txt").get().asFile
		eula.parentFile.mkdirs()
		eula.text = "eula=true\n"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
